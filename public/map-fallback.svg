<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, Arial, sans-serif">
  <rect width="1600" height="1000" fill="#EDF1F6"/>
  <!-- city blocks -->
  <g fill="#FFFFFF">
    <rect x="620" y="330" width="90" height="70"/><rect x="730" y="330" width="80" height="70"/>
    <rect x="620" y="420" width="90" height="60"/><rect x="730" y="420" width="80" height="60"/>
    <rect x="840" y="330" width="100" height="70"/><rect x="840" y="420" width="100" height="60"/>
    <rect x="970" y="330" width="80" height="150"/>
    <rect x="620" y="510" width="90" height="80"/><rect x="730" y="510" width="80" height="80"/>
    <rect x="840" y="510" width="100" height="80"/><rect x="970" y="510" width="80" height="80"/>
    <rect x="180" y="500" width="120" height="90"/><rect x="330" y="500" width="110" height="90"/>
    <rect x="180" y="620" width="120" height="80"/><rect x="330" y="620" width="110" height="80"/>
    <rect x="1120" y="180" width="120" height="90"/><rect x="1270" y="180" width="110" height="90"/>
    <rect x="1120" y="300" width="120" height="80"/><rect x="1270" y="300" width="110" height="80"/>
  </g>
  <!-- park -->
  <rect x="480" y="120" width="260" height="150" rx="14" fill="#D9EBD3"/>
  <text x="610" y="200" font-size="10" fill="#5B8A4E" text-anchor="middle" letter-spacing="1">UHURU PARK</text>
  <rect x="80" y="760" width="220" height="150" rx="14" fill="#D9EBD3"/>
  <text x="190" y="840" font-size="10" fill="#5B8A4E" text-anchor="middle" letter-spacing="1">NBI ARBORETUM</text>
  <!-- roads: A109 Mombasa Rd (Nairobi -> Mombasa SE), A104 (Nairobi -> Nakuru NW), A2 Thika Rd (NE) -->
  <g fill="none" stroke-linecap="round">
    <path d="M-20 640 C300 620 600 560 780 520 C1050 460 1300 500 1620 560" stroke="#FFFFFF" stroke-width="16"/>
    <path d="M-20 640 C300 620 600 560 780 520 C1050 460 1300 500 1620 560" stroke="#0A1A2F" stroke-width="1.6"/>
    <path d="M700 520 C620 380 480 260 300 160 C200 105 100 70 -20 40" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M700 520 C620 380 480 260 300 160 C200 105 100 70 -20 40" stroke="#0A1A2F" stroke-width="1.5"/>
    <path d="M800 480 C950 330 1150 200 1400 120 C1470 100 1540 80 1620 60" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M800 480 C950 330 1150 200 1400 120 C1470 100 1540 80 1620 60" stroke="#0A1A2F" stroke-width="1.5"/>
    <!-- city streets -->
    <path d="M560 300 L1100 300 M560 640 L1100 640 M560 300 L560 640 M1100 300 L1100 640" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M560 300 L1100 300 M560 640 L1100 640 M560 300 L560 640 M1100 300 L1100 640" stroke="#0A1A2F" stroke-width="1"/>
    <!-- westlands link -->
    <path d="M300 160 C420 200 520 240 560 300" stroke="#FFFFFF" stroke-width="9"/>
    <path d="M300 160 C420 200 520 240 560 300" stroke="#0A1A2F" stroke-width="0.9"/>
  </g>
  <!-- road labels -->
  <g font-size="11" fill="#46586D" font-weight="600">
    <text x="1080" y="445" transform="rotate(-6 1080 445)">A109 · MOMBASA RD</text>
    <text x="330" y="225" transform="rotate(33 330 225)">A104 · NAKURU HWY</text>
    <text x="1130" y="255" transform="rotate(-27 1130 255)">A2 · THIKA RD</text>
  </g>
  <!-- place labels -->
  <g font-size="10" fill="#7C8DA2" letter-spacing="1">
    <text x="800" y="290" text-anchor="middle">NAIROBI CBD</text>
    <text x="1250" y="600">INDUSTRIAL AREA</text>
    <text x="250" y="120">WESTLANDS</text>
    <text x="1420" y="105">RUIRU</text>
    <text x="60" y="620">KAREN</text>
  </g>
  <!-- depot marker -->
  <circle cx="1250" cy="540" r="7" fill="#06B6D4"/>
  <circle cx="1250" cy="540" r="13" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1250" y="520" font-size="10" fill="#0A1A2F" font-weight="700" text-anchor="middle">FBV DEPOT</text>
  <!-- compass -->
  <g transform="translate(1540,60)">
    <circle r="20" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M0 -12 L5 6 L0 2 L-5 6 Z" fill="#0A1A2F"/>
    <text y="-26" font-size="10" fill="#46586D" text-anchor="middle" font-weight="700">N</text>
  </g>
</svg>
